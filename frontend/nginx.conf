# v0.4 nginx: SPA + proxy al backend (servicio "backend:5000" en compose)
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # API Flask
  location /api/ {
    proxy_pass http://backend:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # Fotos subidas
  location /uploads/ {
    proxy_pass http://backend:5000;
    proxy_set_header Host $host;
  }

  # SPA Angular: todo lo demas va al index
  location / {
    try_files $uri $uri/ /index.html;
  }
}
